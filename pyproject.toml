[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-beta"
version = "1.0.0"
description = "Algorithmic execution trading bot for Indian Equities & Derivatives (NSE/BSE)"
authors = [{ name = "Algorithmic Trading Engineer" }]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pyotp>=2.9.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
